[databases]
; DB name the app connects to == the pgbouncer virtual DB name here. Points
; at the real Postgres container (docker/postgres) on the internal network —
; nginx/cloudflared never see this port, only `app` does.
robincalls = host=postgres port=5432 dbname=robincalls

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Transaction pooling: a connection is returned to the pool the moment a
; transaction commits, not when the client disconnects — this is what makes
; pgbouncer worth running in front of a Next.js app that opens a fresh pool
; connection per request/route instance.
;
; IMPORTANT caveat that transaction mode brings: named prepared statements
; can't survive across transactions since the underlying server connection
; may change between them. node-postgres (`pg`, and Drizzle's node-postgres
; driver) doesn't use named prepared statements by default, so this is safe
; out of the box — but if anything switches to the `pg` driver's `Statement`/
; prepared-name API, or another Postgres client that prepares by name, it
; will break under this mode and needs `pool_mode = session` instead (loses
; most of the pooling benefit) or per-statement opt-out.
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5

; Loud on the way in, quiet in steady state — makes early misconfiguration
; (wrong password, unreachable postgres host) visible in `docker logs`.
admin_users = pgbouncer_admin
