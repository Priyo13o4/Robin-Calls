user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # cloudflared is the only thing that talks to this container — real client
  # IP arrives via CF-Connecting-IP, not the TCP peer (which is the tunnel).
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12; # docker-compose's default bridge network

  # ── Upstreams are resolved PER REQUEST, not once at startup ───────────────
  #
  # An `upstream { server app:3000; }` block resolves its hostname when the
  # config loads and then never again. Compose recreates containers on every
  # deploy and hands out fresh IPs, so a long-lived nginx keeps dialling an
  # address nobody is listening on — and since `up -d nginx` is a no-op when
  # only the bind-mounted config changed (see the deploy notes in
  # build-and-push.yml), "nginx wasn't recreated" is the normal case, not the
  # unusual one.
  #
  # Putting the target in a VARIABLE is what defers resolution to request time;
  # a static upstream block will not re-resolve no matter what resolver is
  # configured. 127.0.0.11 is Docker's embedded DNS, always present on a
  # user-defined network.
  #
  # The cost is upstream keepalive, which only an `upstream` block can enable.
  # That is a TCP handshake per request across a local bridge network —
  # microseconds against a Next.js render, and worth paying to never serve a
  # deploy's worth of 502s from a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ── First-party analytics: structured JSON log ────────────────────────────
  #
  # Every request is logged as a single JSON object to /var/log/nginx/analytics.log.
  # The app container mounts this volume read-only and a pg_cron job ingests it
  # periodically. Raw IPs are never persisted to Postgres — hashing happens at
  # ingest time. CWA stays active in parallel for bot-filtered audience metrics;
  # this log is the operational observability layer.
  log_format analytics_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"country":"$http_cf_ipcountry",'
    '"cf_ray":"$http_cf_ray"'
  '}';

  # Suppress health checks, internal jobs, admin console pages, and CSP telemetry from the analytics log.
  # Admin requests and browser telemetry shouldn't pollute audience metrics or inflate error rates.
  # 0 = don't log, 1 = log.
  map $request_uri $analytics_loggable_path {
    default                       1;
    ~^/api/stats                  0;
    ~^/health                     0;
    ~^/admin                      0;
    ~^/api/jobs                   0;
    ~^/api/internal               0;
    ~^/api/csp-report             0;
  }

  # Next.js sets this header ONLY on background <Link>/router.prefetch() fetches,
  # never on a real click-through navigation (both are RSC fetches with the same
  # `?_rsc=` shape, so filtering on the query param would drop real ones too).
  # Confirmed live 2026-08-28: /admin/analytics's 30s freshness timer re-renders
  # the layout, which re-triggers prefetch of the nav's own links — 3 hits to
  # "/" every ~30s from one idle admin tab, no real visitor involved. Without
  # this, the dashboard inflates the exact number it's showing you.
  map $http_next_router_prefetch $analytics_loggable_prefetch {
    default 1;
    "1"     0;
  }

  map "$analytics_loggable_path:$analytics_loggable_prefetch" $analytics_loggable {
    default 0;
    "1:1"   1;
  }

  access_log /var/log/nginx/analytics.log analytics_json buffer=64k flush=5s if=$analytics_loggable;

  # next dev's HMR client (/_next/webpack-hmr) needs a real WS upgrade; a plain
  # proxy_pass downgrades it to HTTP/1.1 and Next answers 404. No-op in
  # production (standalone build, no HMR socket ever connects there).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Edge rate limits ──────────────────────────────────────────────────────
  #
  # /mcp and /agent/* never traverse proxy.ts, so `classifyPath` cannot see
  # them and the Valkey limiter never runs — retiring the old `mcp` class was
  # right, but its budget has to live somewhere, and this is the only layer
  # both paths pass through. docs/MCP.md says rate limiting is edge-level;
  # these are the lines that make that sentence true.
  #
  # 30r/m for MCP is parity with the retired class. /agent/ is looser because
  # one chat turn is legitimately several POSTs — the browser runs the BYOK
  # loop and calls back per server-locale tool — so a per-request budget sized
  # for a single JSON-RPC call would break normal use.
  #
  # limit_conn matters more than usual here: /agent/chat is SSE, so one request
  # can hold a connection for the full 210s. Without a cap a single caller can
  # park hundreds of open turns.
  limit_req_zone $binary_remote_addr zone=rc_mcp:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=rc_agent:10m rate=120r/m;
  # /api/sync/v1 (prod -> local-smoke sync): one puller, ~20 pages/min idle. Behind the tunnel every
  # caller shares one address, so this is a global ceiling on what sync can cost prod.
  limit_req_zone $binary_remote_addr zone=rc_sync:1m rate=120r/m;
  limit_conn_zone $binary_remote_addr zone=rc_agent_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 80;
    server_name _;

    # ── Security headers. Split deliberately into two tiers.
    #
    #    TIER 1 (below, enforced): four directives that constrain what the page
    #    may do, and touch nothing about what it may LOAD — so they cannot
    #    break a script, style, font or image and are safe to enforce blind.
    #
    #    TIER 2 (Content-Security-Policy-Report-Only, further down): the full
    #    resource policy. Report-Only because this app renders three.js, GSAP,
    #    framer-motion, Next's own inline bootstrap and remote token logos, and
    #    an enforced policy written without observing real traffic breaks the
    #    site rather than protecting it. Collect first, then flip.
    #
    #    `add_header` is inherited by a location only while that location
    #    declares none of its own. None below do — keep it that way, or the
    #    headers silently vanish from exactly the route that added one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors, not X-Frame-Options: it is the one that is actually
    # specified, and clickjacking a wallet-connect button is the real risk here.
    # object-src/base-uri/form-action close the three injection routes that do
    # not need a script tag.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Report-Only. Every hostname here was taken from a grep of app/ and lib/,
    # not guessed — see docs/ways-of-work/plan/robinbets/03-cache-and-security.md.
    # Fonts are self-hosted by next/font/google at build time, so no font host
    # is listed and none should be added.
    #
    # frame-src names GeckoTerminal because RwaDetailClient and VerdictView both
    # embed its price chart. The first draft of this policy said frame-src 'none'
    # and would have blanked both panels the moment it was enforced — which is
    # the argument for collecting before enforcing, not an argument against it.
    # 'unsafe-inline'/'unsafe-eval' on script-src are here because Next's
    # bootstrap is inline and the WebGL stack compiles shaders; removing them
    # needs a nonce pass through app/layout.tsx, which is its own task. Their
    # presence is the reason this stays Report-Only rather than being promoted
    # early and mistaken for protection it does not give.
    # Hosts added 2026-08-25 from 7 days of real Report-Only traffic, NOT from
    # a grep: cdn.robincalls.com (our own image CDN, the single largest
    # violator), static.cloudflareinsights.com (Cloudflare Web Analytics injects
    # its beacon at the EDGE, downstream of this header, so nginx cannot see the
    # tag it must authorise), s3.tradingview.com + www.tradingview-widget.com
    # (the chart widget, whose logo host was already listed but whose script and
    # frame were not), api/cdn.dexscreener.com (client-side market data).
    #
    # NO `script-src-elem`. Once that directive exists it REPLACES script-src for
    # element loads, silently dropping the 'unsafe-inline' Next's bootstrap needs
    # — the allowlist would arrive and a hundred new violations with it. Add
    # script hosts to script-src itself.
    #
    # IPFS gateways (ipfs.io, gateway.pinata.cloud, <cid>.ipfs.dweb.link) are
    # DELIBERATELY absent and must stay absent. Each token's metadata names its
    # own gateway and its own per-CID subdomain, so there is no finite list to
    # write; allowlisting the wildcard would admit attacker-chosen content from
    # a domain we do not control, into the one product whose job is saying what
    # is safe. Their ~6 violations a week are the open design item (proxy token
    # media through cdn.robincalls.com), not noise to be silenced.
    #
    # Hosts added 2026-09-02 for connect-src: rpc.mainnet.chain.robinhood.com
    # (/token-sale's client multicall hits the public RPC directly), and the
    # three WalletConnect/AppKit hosts the QR path already needs. The testnet
    # RPC is NOT listed — only opt-in test builds use it, never this deploy.
    # api.geckoterminal.com added 2026-09-28: the trades table reads recent trades
    # from the browser (TradingTransactionsTable).
    # Keep it Report-Only: promoting to enforcing is a separate decision.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.robincalls.com https://cdn.dexscreener.com https://s3-symbol-logo.tradingview.com https://robinhoodchain.blockscout.com https://www.pinksale.finance; font-src 'self' data:; connect-src 'self' blob: https://api.dexscreener.com https://api.geckoterminal.com https://robinhoodchain.blockscout.com https://rpc.mainnet.chain.robinhood.com https://api.web3modal.org https://pulse.walletconnect.org wss://relay.walletconnect.org; frame-src https://www.geckoterminal.com https://www.tradingview-widget.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;

    # ── The internal contract between the agent plane and Next is NOT a
    #    public API. It is guarded first by `requireJobAuth`, following the
    #    same secret-first precedent as /api/jobs/*; this deny is the second
    #    layer CLAUDE.md §6 asks for ("both are required"). Four lines, and it
    #    means a leaked secret alone is not enough to reach the dispatcher
    #    from outside. The agent container talks to `app` over the internal
    #    network and never traverses nginx, so nothing legitimate is blocked.
    #    Case-INSENSITIVE regex, not a prefix: nginx prefix matching is
    #    case-sensitive, so `location /api/internal/` let /API/internal/ walk
    #    straight past the deny. Next 404s it anyway, but a second layer that
    #    a change of case defeats is not a second layer.
    location ~* ^/api/internal/ {
      deny all;
      return 404;
    }

    # ── MCP: external agents. JSON-RPC request/response, no streaming, but a
    #    tools/call carrying scan_token rides the same ~180s pipeline budget
    #    as /api/scan below — so it gets the same generous read timeout. A
    #    shorter one here would turn an honest slow scan into a transport
    #    fault, which the agent would then narrate as a finding about the
    #    token (implementation-plan §12.4).
    #
    #    Exact match, not a prefix: the surface is one endpoint, and `location
    #    /mcp` would also proxy /mcpfoo.
    location = /mcp {
      limit_req zone=rc_mcp burst=10 nodelay;
      limit_conn rc_agent_conn 8;
      set $mcp_upstream http://agent:8000;
      proxy_pass $mcp_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # OVERWRITE, never forward. This header ends up as the per-IP key for the
      # fresh-scan budget (agent → /api/internal/v1/scan → x-forwarded-for), so
      # a caller-supplied value means randomising it defeats SCAN_IP_DAILY_LIMIT
      # outright, and setting it to someone else's address 429s that person on
      # robincalls.com for the rest of the UTC day. $remote_addr is already the
      # real client — real_ip_header above rewrites it from CF-Connecting-IP.
      proxy_set_header x-rc-caller-ip $remote_addr;
      proxy_read_timeout 210s;
      proxy_send_timeout 210s;
    }

    # ── The chat surface. /agent/chat is Server-Sent Events, and nginx buffers
    #    proxied responses by default — which would hold the entire turn until
    #    it ended, so the user would watch a spinner and then receive
    #    everything at once. Same failure /api/scan documents below. The app
    #    also sets X-Accel-Buffering: no; both are here because either one
    #    alone is a single point of forgetting.
    location /agent/ {
      limit_req zone=rc_agent burst=20 nodelay;
      limit_conn rc_agent_conn 8;
      set $agent_upstream http://agent:8000;
      proxy_pass $agent_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # See the note on /mcp — same header, same reason. /agent/tool carries no
      # bearer by design, so this is what keeps its scan path attributable.
      proxy_set_header x-rc-caller-ip $remote_addr;
      proxy_read_timeout 210s;
      proxy_send_timeout 210s;
      proxy_buffering off;
      proxy_cache off;
    }

    # ── The scan route streams progressive results and can legitimately run
    #    close to its own 180s route-level deadline (see .env SCAN_TERMINAL_
    #    DEADLINE_MS). Both settings below matter together:
    #      - proxy_read_timeout must clear the app's own deadline, or nginx
    #        cuts the connection a few seconds before the app would have
    #        replied with an honest error.
    #      - proxy_buffering off is required for the response to actually
    #        stream to the client as chunks arrive, instead of nginx holding
    #        the whole body until the upstream closes the connection.
    location /api/scan {
      set $scan_upstream http://app:3000;
      proxy_pass $scan_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 210s;
      proxy_send_timeout 210s;
      proxy_buffering off;
    }

    location /api/sync/ {
      limit_req zone=rc_sync burst=20 nodelay;
      limit_except GET { deny all; }
      client_max_body_size 1k;
      set $sync_upstream http://app:3000;
      proxy_pass $sync_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location / {
      set $app_upstream http://app:3000;
      proxy_pass $app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
      proxy_send_timeout 65s;
    }
  }
}
