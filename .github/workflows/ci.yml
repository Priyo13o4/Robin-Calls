name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Build Next.js
        run: npm run build
        env:
          BETTER_AUTH_SECRET: build-time-placeholder-not-the-real-secret

      - name: Check for uncommitted changes
        run: git diff --check

  # The agent plane. A separate job rather than steps bolted onto the Node one:
  # they share no toolchain, and a Python lint failure should not read as "the
  # website is broken".
  #
  # This job is not independent of the repo it lives in, on purpose. The
  # registry tests scan `lib/internal/reads.ts` and `lib/agent/client-tools.ts`
  # for cross-references, and the parity test reads the snapshot captured from
  # the MCP server that was retired — so a change on the TypeScript side that
  # orphans a tool fails HERE, which is the only place that can see both halves.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      # No INTERNAL_JOB_SECRET is set: every test stubs the Next egress, and a
      # test suite that needed a real secret would be a test suite that could
      # reach production data.
      - name: Test
        run: pytest -q

      # The Node job builds Next (`npm run build`), so a broken frontend build
      # fails on the branch. The agent had no equivalent: a Dockerfile error or
      # a dependency that will not resolve first appeared in build-and-push.yml
      # on `main`, after merge, with the deploy already running.
      #
      # No push and no registry login — this proves the image builds, nothing
      # more. Publishing stays where it belongs, on main.
      - name: Build the agent image
        uses: docker/build-push-action@v5
        with:
          context: services/agent
          file: services/agent/Dockerfile
          push: false
