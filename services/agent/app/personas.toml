[[persona]]
name = "tracer"
title = "The Tracer"
collection = "internal"
allowed_tools = [
  "get_contract_identity",
  "get_pool_identity",
  "find_pools_for_pair",
  "lookup_trusted_address",
  "get_dex_registry",
  "get_verdict",
  "get_latest_verdict",
  "get_verdict_evidence",
  "lookup_deployer",
